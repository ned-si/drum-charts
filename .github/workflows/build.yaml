name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

env:
  # Same version the charts were engraved with; bump with the \version lines.
  LILYPOND_IMAGE: codello/lilypond:2.24.4@sha256:1b62064c51436bee7f40f04be5beecfaf003b8cd04009b0b4888d6dc6365108b
  # FluidR3_GM.sf2 from Ubuntu 24.04 fluid-soundfont-gm 3.1-5.3.
  SOUNDFONT_SHA256: 74594e8f4250680adf590507a306655a299935343583256f3b722c48a1bc1cb0

# One release per chart version, <slug>-<date>-<sha7>; the rules are in
# ned-si/homelab .kiro/specs/drum-charts-per-song-releases/design.md.
jobs:
  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      # The full history: the plan's tags come from git, and branch runs
      # diff against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      # A change to the build recipe on a branch builds every chart, so it
      # is tested before main.
      - name: Plan the charts to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          all=()
          if [ "$GITHUB_REF" != refs/heads/main ] &&
             ! git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- Makefile .github/workflows/build.yaml; then
            all=(--build-all)
          fi
          python3 scripts/release-plan.py --releases "$RUNNER_TEMP/releases.json" "${all[@]}" build/plan.json
          targets=$(jq -r '[.charts[] | select(.build) | .assets[] | "build/" + .] | join(" ")' build/plan.json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '[.charts[] | select(.build)] | length' build/plan.json)" >> "$GITHUB_OUTPUT"
      - name: Install the audio tools
        if: steps.plan.outputs.count != '0'
        run: |
          sudo apt-get install -y -q --no-install-recommends fluidsynth fluid-soundfont-gm ffmpeg
          echo "${SOUNDFONT_SHA256}  /usr/share/sounds/sf2/FluidR3_GM.sf2" | sha256sum -c
          docker pull -q "$LILYPOND_IMAGE"
      - name: Build the PDFs and the audio
        if: steps.plan.outputs.count != '0'
        env:
          TARGETS: ${{ steps.plan.outputs.targets }}
        run: |
          # shellcheck disable=SC2086 # one word per target
          make -j"$(nproc)" $TARGETS \
            LILYPOND="docker run --rm -u $(id -u):$(id -g) -v $PWD:$PWD -w $PWD --entrypoint lilypond $LILYPOND_IMAGE"
      # Over the MP3s of the plan, so a legend-only build checks none.
      - name: Check the audio is not silent
        if: steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          for f in $(jq -r '.charts[] | select(.build) | .assets[] | select(endswith(".mp3")) | "build/" + .' build/plan.json); do
            max=$(ffmpeg -nostdin -i "$f" -af volumedetect -f null - 2>&1 | sed -n 's/.*max_volume: \(-\{0,1\}[0-9.]*\) dB/\1/p')
            echo "$f max_volume ${max} dB"
            awk -v m="$max" 'BEGIN { exit !(m != "" && m > -40) }'
          done
      # A chart fits on 2 pages so it never needs a page turn; a long song
      # may take 3 if its .ly has the line "% chart: long".
      - name: Check the page count
        if: steps.plan.outputs.count != '0'
        run: |
          status=0
          for f in build/*.pdf; do
            song="songs/$(basename "$f" .pdf).ly"
            [ -f "$song" ] || continue
            pages=$(pdfinfo "$f" | awk '/^Pages:/ { print $2 }')
            echo "$f $pages pages"
            if [ "$pages" -gt 3 ]; then
              echo "::error file=$song::$pages pages, the limit is 3"
              status=1
            elif [ "$pages" -eq 3 ] && ! grep -q '^% chart: long' "$song"; then
              echo "::warning file=$song::3 pages; fit it on 2 or mark it % chart: long"
            fi
          done
          exit "$status"
      # Before the download of the other charts, so it holds the built ones only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.count != '0'
        with:
          name: drum-charts-${{ github.sha }}
          path: |
            build/*.pdf
            build/*.mp3
            build/plan.json
          if-no-files-found: error
          retention-days: 7
      # Descriptor 3, so gh cannot read the list on its standard input.
      - name: Fetch the other charts' PDFs from their releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r tag slug <&3; do
            gh release download "$tag" --pattern "$slug.pdf" --dir build
          done 3< <(jq -r '.charts[] | select(.build | not) | [.tag, .slug] | @tsv' build/plan.json)
      # On every branch, over every chart, so a bad header fails before main.
      - name: Build the site data
        run: python3 scripts/site-data.py --plan build/plan.json build build/site-data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-data-${{ github.sha }}
          path: build/site-data
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' && needs.charts.outputs.count != '0'
    needs: charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # An older run that finishes last must not publish older versions.
      - name: Check this is the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at ${head::7}, not ${GITHUB_SHA::7}; not the head of main; nothing published"
            echo "head=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.head == 'true'
        with:
          name: drum-charts-${{ github.sha }}
          path: charts
      # A draft until every asset is uploaded. An existing release is a draft
      # left by a failed run or one the plan saw incomplete: --clobber makes
      # it hold this build's files, which the site data holds.
      - name: Publish a release per chart built
        if: steps.head.outputs.head == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while IFS=$'\t' read -r tag commit assets <&3; do
            files=(); for a in $assets; do files+=("charts/$a"); done
            if out=$(gh release view "$tag" --json isDraft 2>&1); then
              gh release upload "$tag" "${files[@]}" --clobber
            elif [[ $out == *"release not found"* ]]; then
              gh release create "$tag" "${files[@]}" --draft --target "$commit" \
                --title "$tag" --notes "Chart of $commit, built by $run."
            else
              echo "$out" >&2; exit 1
            fi
            gh release edit "$tag" --draft=false --latest
          done 3< <(jq -r '.charts[] | select(.build) | [.tag, .commit, (.assets | join(" "))] | @tsv' charts/plan.json)
  # ghcr.io/ned-si/drum-charts: the data of charts.nedsi.io, read by
  # ned-si/homelab (.kiro/specs/drum-charts-site/design.md#workflow).
  site-data:
    needs: [charts, release]
    # release is skipped when the plan builds nothing.
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.charts.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: site-data
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/ned-si/drum-charts
      # The pin of ned-si/homelab's ci.yaml: one signature format for both.
      COSIGN_VERSION: v3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - name: Check this is the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at ${head::7}, not ${GITHUB_SHA::7}; not the head of main; nothing published"
            echo "head=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.head == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.head == 'true'
        with:
          name: site-data-${{ github.sha }}
          path: build/site-data
      - name: Check the PDFs are the releases'
        if: steps.head.outputs.head == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          status=0
          while IFS=$'\t' read -r slug tag <&3; do
            want=$(jq -r --arg t "$tag" --arg n "$slug.pdf" \
              '[.[][] | select(.tag_name == $t and .draft == false) | .assets[] | select(.name == $n) | .digest] | first // empty' \
              "$RUNNER_TEMP/releases.json")
            got="sha256:$(sha256sum "build/site-data/$slug.pdf" | cut -d' ' -f1)"
            if [ "$got" != "$want" ]; then
              echo "::error::$slug.pdf is $got, the release $tag has ${want:-no such asset}"
              status=1
            fi
          done 3< <(jq -r '(.legend | ["legend", .release]), (.songs[] | [.slug, .release]) | @tsv' build/site-data/charts.json)
          exit "$status"
      # Every file is deterministic for the same releases, so equal files
      # mean nothing changed (a README push). The package is public.
      - name: Compare with :main
        id: compare
        if: steps.head.outputs.head == 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/main"
          id=$(docker create --platform linux/amd64 "$IMAGE:main" /none)
          trap 'docker rm "$id" > /dev/null' EXIT
          docker cp "$id:/charts/." "$RUNNER_TEMP/main"
          sums() { (cd "$1" && find . -type f | LC_ALL=C sort | xargs sha256sum); }
          if [ "$(sums build/site-data)" = "$(sums "$RUNNER_TEMP/main")" ]; then
            echo "::notice::the site data equals :main; nothing published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.compare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # The default docker driver rejects --provenance.
      - name: Create the attestation builder
        if: steps.compare.outputs.publish == 'true'
        run: docker buildx create --name attest --driver docker-container
      # Two platforms so any machine can read it with docker create
      # --platform. No SBOM: the image holds no software.
      - name: Build and push the data image
        if: steps.compare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker buildx build --builder attest --platform linux/amd64,linux/arm64 --push \
            --provenance=mode=max -f site-data.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/ned-si/drum-charts \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label org.opencontainers.image.licenses=CC-BY-4.0 \
            -t "$IMAGE:$GITHUB_SHA" build/site-data
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "$IMAGE:$GITHUB_SHA@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.compare.outputs.publish == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Install the pinned cosign
        if: steps.compare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -m 120 --retry 3 -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum -c
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Keyless with the workflow's OIDC identity, classic .sig tag: the
      # flags of homelab's site-publish.
      - name: Sign and verify the index digest
        if: steps.compare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/ned-si/drum-charts/.github/workflows/build.yaml@refs/heads/main \
            "$IMAGE@$DIGEST" > /dev/null
          echo "signed and verified $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only the head of main moves :main, so an older run that finishes
      # last, or a rerun of an older commit, never takes the site back.
      - name: Tag the signed digest as main
        if: steps.compare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api repos/ned-si/drum-charts/commits/main --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at ${head::7}, not ${GITHUB_SHA::7}; :main not moved"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"
      - name: Log out of GHCR
        if: ${{ always() && steps.compare.outputs.publish == 'true' }}
        run: docker logout ghcr.io
